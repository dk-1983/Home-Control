        number:
          min: 1
          mode: box
          step: 1
    source:
      required: true
      selector:
        object:
    producer_session:
      required: true
      selector:
        text:
    revision:
      required: true
      selector:
        number:
          min: 1
          mode: box
          step: 1
    center_session:
      required: true
      selector:
        text:
    event:
      required: true
      selector:
        object:

unregister_voice_source:
  fields:
    protocol_version:
      required: true
      selector:
        number:
          min: 1
          mode: box
          step: 1
    source:
      required: true
      selector:
        object:
    producer_session:
      required: true
      selector:
        text:
