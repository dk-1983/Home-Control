announce:
  fields:
    source:
      required: true
      selector:
        config_entry:
          integration: home_control
    key:
      required: true
      example: water_pressure
      selector:
        text:
    level:
      default: INFO
      selector:
        select:
          options:
            - INFO
            - WARNING
            - ERROR
    message:
      selector:
        text:
          multiline: true
    active:
      default: false
      selector:
        boolean:
    resolved:
      default: false
      selector:
        boolean:

register_voice_source:
  fields:
    protocol_version:
      required: true
      selector:
        number:
          min: 1
          mode: box
          step: 1
    source:
      required: true
      selector:
        object:
    producer_session:
      required: true
      selector:
        text:
    revision:
      required: true
      selector:
        number:
          min: 1
          mode: box
          step: 1
    name:
      required: true
      selector:
        text:
    area_id:
      required: true
      selector:
        text:
    preferences:
      required: true
      selector:
        object:
    maintenance:
      required: true
      selector:
        boolean:
    active_issues:
      required: true
      selector:
        object:

