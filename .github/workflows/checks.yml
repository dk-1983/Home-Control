name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.15.7
      - run: ruff check .
      - run: ruff format --check .
      - run: mkdir -p work
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tests
  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.3 paho-mqtt==2.1.0
      - run: mkdir -p work
      - run: python -m unittest discover -s tests -v
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
